services:
  vad-ui:
    build: .
    command:
      - python
      - -m
      - vad.server.serve
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --db
      - /tmp/vad-server/vad.sqlite3
      - --ui-root
      - /tmp/vad-ui
      - --evidence-root
      - /tmp/vad-evidence
      - --seed-level3-demo
    ports:
      - "8080:8080"
    environment:
      VAD_LIVE_SERVICES: "disabled"
  vad-control-plane:
    profiles:
      - level4
    build: .
    command:
      - vad
      - local-os
      - demo
      - --host
      - 0.0.0.0
      - --allow-non-local-bind
      - --port
      - "8080"
      - --db
      - /tmp/vad-local-os/vad.sqlite3
      - --ui-root
      - /tmp/vad-local-os/ui
      - --evidence-root
      - /tmp/vad-local-os/evidence
      - --plugin-root
      - /tmp/vad-local-os/plugins
    ports:
      - "8081:8080"
    environment:
      VAD_LIVE_SERVICES: "disabled"
      VAD_CONTROL_PLANE_LOG_LEVEL: "info"
