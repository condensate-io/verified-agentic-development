# ==============================================================================
# Verified Agentic Development (VAD) - Cross-Platform Relay Configuration
# ==============================================================================
# This configuration controls cross-platform hook relaying between Windows,
# WSL (Windows Subsystem for Linux), macOS (Darwin), and native Linux.

# Execution mode: 'auto' (detect environment), 'wsl', 'native_linux', 'macos', 'windows'
PLATFORM_MODE=auto

# WSL distribution name (leave empty for default WSL distribution)
WSL_DISTRO=

# Path translation between Windows drive letters and POSIX mount points
WINDOWS_TO_WSL_TRANSLATE=true
WSL_TO_WINDOWS_TRANSLATE=true

# Preferred Python interpreters per environment
PYTHON_LINUX=python3
PYTHON_MACOS=python3
PYTHON_WSL=python3
PYTHON_WINDOWS=python.exe

# Maximum execution timeout in seconds for relayed hook calls
HOOK_TIMEOUT_SECONDS=15

# Verbose relay diagnostic logs (0 = silent, 1 = debug stderr output)
PLATFORM_DEBUG=0
