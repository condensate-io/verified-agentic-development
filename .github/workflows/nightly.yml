name: Nightly Extended Verification

on:
  schedule:
    - cron: '0 2 * * *' # Run at 2 AM every day

jobs:
  extended-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run extended pytest suite
        run: |
          pytest tests/
